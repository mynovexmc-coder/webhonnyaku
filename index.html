<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>押すな（1000000物理演算）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      font-family: "Noto Sans JP", sans-serif;
    }
    #physCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #btnDontPress {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="flex items-center justify-center select-none">
  <canvas id="physCanvas"></canvas>
  <button id="btnDontPress" type="button" class="px-8 py-4 text-xl sm:text-2xl font-black rounded-2xl bg-red-600 hover:bg-red-500 active:scale-95 text-white shadow-xl transition">
    押すな
  </button>

  <script>
    (function () {
      const TARGET = 1000000;
      const canvas = document.getElementById('physCanvas');
      const ctx = canvas.getContext('2d');
      const btn = document.getElementById('btnDontPress');

      const colors = ['#38bdf8', '#f472b6', '#fbbf24', '#34d399', '#818cf8'];
      const px = new Float32Array(TARGET);
      const py = new Float32Array(TARGET);
      const vx = new Float32Array(TARGET);
      const vy = new Float32Array(TARGET);
      const pCol = new Uint8Array(TARGET);

      let activeCount = 0;
      let heavyTriggered = false;
      let rafId = null;
      let lastTime = 0;

      function resizeCanvas() {
        const w = window.innerWidth || document.documentElement.clientWidth || 800;
        const h = window.innerHeight || document.documentElement.clientHeight || 600;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(300, Math.floor(w * dpr));
        canvas.height = Math.max(200, Math.floor(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function runPhysicsLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        lastTime = 0;

        function tick(now) {
          const dt = lastTime ? Math.min(0.05, (now - lastTime) * 0.001) : 0.016;
          lastTime = now;

          const w = window.innerWidth || 800;
          const h = window.innerHeight || 600;
          const gravity = 840;
          const bounce = 0.82;
          const drag = 0.995;

          for (let i = 0; i < activeCount; i++) {
            vy[i] += gravity * dt;
            vx[i] *= drag;
            vy[i] *= drag;
            px[i] += vx[i] * dt;
            py[i] += vy[i] * dt;

            if (px[i] < 0) {
              px[i] = 0;
              vx[i] = Math.abs(vx[i]) * bounce;
            } else if (px[i] > w) {
              px[i] = w;
              vx[i] = -Math.abs(vx[i]) * bounce;
            }

            if (py[i] < 0) {
              py[i] = 0;
              vy[i] = Math.abs(vy[i]) * bounce;
            } else if (py[i] > h - 3) {
              py[i] = h - 3;
              vy[i] = -Math.abs(vy[i]) * bounce;
            }
          }

          // Extra physics step when "押すな" has been pressed
          if (heavyTriggered) {
            for (let i = 0; i < activeCount; i++) {
              vx[i] += Math.sin(py[i] * 0.02 + px[i] * 0.02) * 35 * dt;
              vy[i] += Math.cos(px[i] * 0.02 - py[i] * 0.02) * 35 * dt;
            }
          }

          ctx.fillStyle = '#090d16';
          ctx.fillRect(0, 0, w, h);

          for (let c = 0; c < colors.length; c++) {
            ctx.fillStyle = colors[c];
            ctx.beginPath();
            for (let i = 0; i < activeCount; i++) {
              if (pCol[i] === c) {
                ctx.rect(px[i], py[i], 2, 2);
              }
            }
            ctx.fill();
          }

          rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);
      }

      function onDontPressClick() {
        resizeCanvas();
        const vw = window.innerWidth || 800;
        const vh = window.innerHeight || 600;

        for (let i = 0; i < TARGET; i++) {
          px[i] = Math.random() * vw;
          py[i] = Math.random() * (vh * 0.5);
          vx[i] = (Math.random() - 0.5) * 440;
          vy[i] = (Math.random() - 0.5) * 280 - 150;
          pCol[i] = i % colors.length;
        }
        activeCount = TARGET;
        heavyTriggered = true;
        runPhysicsLoop();
      }

      window.addEventListener('resize', resizeCanvas);
      btn.addEventListener('click', onDontPressClick);
      resizeCanvas();
    })();
  </script>
</body>
</html>
